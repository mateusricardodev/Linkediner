name: Avaliação de IA

# Só manual: cada execução chama o modelo real e tem custo.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Quantos currículos sintéticos avaliar (cada um faz 5 chamadas)'
        default: '30'

permissions:
  contents: read

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Avaliar o modelo
        run: pnpm --filter @linkediner/ai-evals eval --limit="$LIMIT"
        env:
          LIMIT: ${{ inputs.limit }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL_EXTRACT: ${{ vars.AI_MODEL_EXTRACT }}
          AI_MODEL_GENERATE: ${{ vars.AI_MODEL_GENERATE }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-avaliacao
          path: packages/ai-evals/reports/
