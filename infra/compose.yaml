# Ambiente local (docs/arquitetura/08-operacao.md). Credenciais apenas para desenvolvimento.
name: linkediner

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: linkediner
      POSTGRES_PASSWORD: linkediner
      POSTGRES_DB: linkediner
    ports: ['5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linkediner']
      interval: 5s
      retries: 10

  # Storage compatível com S3. SeaweedFS (Apache 2.0): as imagens do MinIO não estavam disponíveis no Docker Hub quando o ambiente foi montado.
  # O bucket é criado pela aplicação no primeiro uso. A retenção de 30 dias também é aplicada pelo job privacy.expire_documents.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ['9000:9000']
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['8025:8025', '1025:1025']

volumes:
  postgres-data:
  s3-data:
